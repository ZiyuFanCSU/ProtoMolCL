device: cuda                                      # training device
seed: 42                                          # random seed
num_run: 3                                        # number of runs
verbose: True                                     # verbose

model:
  backbone: gps                                   # which backbone to use [gin, gps]
  num_layer: 3                                    # number of graph conv layers
  num_layer_low: 2                                # number of graph conv layers
  num_layer_mid: 4                                # number of graph conv layers
  num_layer_high: 5                               # number of graph conv layers
  emb_dim: 300                                    # embedding dimension in graph conv layers
  heads: 6                                        # number of attention head of graph transformer

optim:
  pretrain_lr: 0.0005                             # learning rate of pretrain module
  finetune_lr: 0.001                              # learning rate of finetune prediction head
  decay: 1e-6                                     # learning decay
  gradient_clip: 5                                # gradient clip
  scheduler: cos_anneal                           # scheduler type

dataset:
  data_dir: ./data/finetune/moleculenet           # data directory
  num_workers: 0                                  # number of workers in dataloader
  feat_type: super_rich                           # whether use basic/rich/super_rich feature
  task: classification                            # classification/regression task